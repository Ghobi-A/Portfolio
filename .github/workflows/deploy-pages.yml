name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Build and deploy run as separate jobs, as in GitHub's own Pages template.
# Deploying from the same job that uploaded the artifact can race the artifact
# service: the upload finalises, but listing the run's artifacts a second later
# returns nothing ("No artifacts named github-pages were found").
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the React app (type-check, client build, prerender)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build polished static site
        run: |
          python scripts/build_site.py
          python scripts/test_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
