name: Validate static portfolio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the React app (type-check, client build, prerender)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build and validate generated site
        run: |
          python scripts/build_site.py
          python scripts/test_site.py
      - name: Retain reviewable build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-build
          path: _site
