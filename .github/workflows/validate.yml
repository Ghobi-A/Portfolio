name: Validate static portfolio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and validate generated site
        run: |
          python scripts/build_site.py
          python scripts/test_site.py
          node --check assets/js/main.js
          node --check assets/js/motion.js
      - name: Retain reviewable build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-build
          path: _site
